<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF5EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>漢堡疊疊樂 🍔</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: #FFF5EB;
    color: #3D2914;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #FFE8D6 0%, #FFF5EB 40%, #FFEFD9 100%);
    box-shadow: 0 0 40px rgba(180,100,60,0.12);
    padding-top: env(safe-area-inset-top, 0);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  #banner {
    flex: 0 0 auto;
    background: linear-gradient(135deg, #FF6B9D 0%, #FF8FB5 50%, #FF6B9D 100%);
    color: #fff;
    text-align: center;
    padding: 6px 12px 7px;
    box-shadow: 0 2px 10px rgba(255,107,157,0.28);
    z-index: 30;
    position: relative;
  }
  #banner h1 {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 0 rgba(0,0,0,0.1);
    line-height: 1.2;
  }
  #banner .hook {
    font-size: 0.72rem;
    opacity: 0.95;
    margin-top: 1px;
    font-weight: 500;
    line-height: 1.2;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 4px;
    padding: 5px 8px 4px;
    font-size: 0.78rem;
    font-weight: 600;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(8px);
    z-index: 40;
    position: relative;
  }
  #hud .pill {
    background: #fff;
    border-radius: 999px;
    padding: 4px 8px;
    box-shadow: 0 1px 4px rgba(180,100,60,0.1);
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #hud .pill.score {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.85rem;
    font-weight: 800;
    color: #C45C26;
    background: linear-gradient(135deg, #FFF8F0, #FFE8D0);
    border: 1.5px solid #FFD0A8;
    padding: 4px 10px;
    z-index: 41;
  }
  #hud .pill.score #scoreEl {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  #hud .acc { color: #E85A8A; }
  #hud .meta { color: #5A3A22; font-size: 0.74rem; }
  #timeBarWrap {
    flex: 0 0 auto;
    padding: 0 10px 5px;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,180,140,0.35);
    z-index: 40;
    position: relative;
  }
  #timeBarTrack {
    position: relative;
    height: 10px;
    border-radius: 999px;
    background: rgba(255,220,190,0.7);
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(180,100,60,0.15);
  }
  #timeBarFill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #FF8A5B, #FF6B9D 55%, #FFB347);
    box-shadow: 0 0 8px rgba(255,107,157,0.35);
    transition: width 0.08s linear, background 0.3s;
    transform-origin: left center;
  }
  #timeBarFill.warn {
    background: linear-gradient(90deg, #FFB347, #FF8A5B 60%, #E85A8A);
  }
  #timeBarFill.critical {
    background: linear-gradient(90deg, #E85A8A, #C62828);
    animation: pulseBar 0.55s ease-in-out infinite alternate;
  }
  @keyframes pulseBar {
    from { filter: brightness(1); }
    to { filter: brightness(1.15); }
  }
  #timeLabel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: #5A3A22;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    pointer-events: none;
  }
  #canvasBox {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    z-index: 1;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  canvas#game:active { cursor: grabbing; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(61,41,20,0.45);
    z-index: 10;
    padding: 12px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #overlay.hidden { display: none; }
  .card {
    background: #FFF9F2;
    border-radius: 20px;
    padding: 20px 18px 16px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(61,41,20,0.25);
    border: 2px solid #FFE0C2;
  }
  .card h2 {
    font-size: 1.35rem;
    margin-bottom: 6px;
    color: #C45C26;
  }
  .card .sub {
    font-size: 0.88rem;
    color: #8B6B4A;
    margin-bottom: 14px;
    line-height: 1.45;
  }
  .btn {
    display: inline-block;
    border: none;
    border-radius: 999px;
    padding: 14px 28px;
    min-height: 48px;
    font-size: 1.05rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    margin: 4px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, #FF6B9D, #FF8A5B);
    color: #fff;
    box-shadow: 0 4px 14px rgba(255,107,157,0.4);
  }
  .btn-secondary {
    background: #fff;
    color: #C45C26;
    border: 2px solid #FFD0A8;
    box-shadow: 0 2px 8px rgba(180,100,60,0.1);
  }
  #resultScreen { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 360px; }
  #resultScreen.show { display: flex; }
  #resultCanvas {
    width: 100%;
    max-width: 300px;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(61,41,20,0.2);
    background: #FFF9F2;
  }
  .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .hint {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.95);
    text-align: center;
    margin-top: 2px;
    line-height: 1.4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  #floatMsg {
    position: absolute;
    left: 50%;
    top: 22%;
    transform: translate(-50%, 0);
    font-size: 1.35rem;
    font-weight: 800;
    color: #FF6B9D;
    text-shadow: 0 2px 8px rgba(255,255,255,0.9);
    pointer-events: none;
    opacity: 0;
    z-index: 6;
    transition: opacity 0.2s, transform 0.4s;
  }
  #floatMsg.show {
    opacity: 1;
    transform: translate(-50%, -20px);
  }
  #controlsHint {
    position: absolute;
    bottom: calc(18px + env(safe-area-inset-bottom, 0));
    left: 0; right: 0;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: #A07858;
    opacity: 0.85;
    pointer-events: none;
    z-index: 3;
  }
  #timeBarWrap { display: none !important; }
  #countdown {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 15;
    pointer-events: none;
    background: rgba(61,41,20,0.28);
  }
  #countdown.show { display: flex; }
  #countdown .cd-num {
    font-size: clamp(3.2rem, 22vw, 5.5rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 4px 24px rgba(61,41,20,0.45), 0 0 2px rgba(255,107,157,0.8);
    animation: cdPop 0.45s ease-out;
  }
  @keyframes cdPop {
    0% { transform: scale(0.55); opacity: 0.3; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #overlay {
    padding: 8px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0));
    align-items: flex-start;
    padding-top: max(8px, env(safe-area-inset-top, 0));
  }
  #resultScreen {
    max-height: calc(100dvh - 24px - env(safe-area-inset-top, 0) - env(safe-area-inset-bottom, 0));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #resultCanvas {
    max-width: min(300px, 78vw);
    max-height: 42vh;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  .result-actions {
    position: sticky;
    bottom: 0;
    padding-bottom: 4px;
    background: transparent;
  }
  @media (max-height: 700px) {
    #banner { padding: 4px 10px 5px; }
    #banner h1 { font-size: 0.95rem; }
    #banner .hook { display: none; }
    #hud { padding: 3px 6px 2px; font-size: 0.72rem; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="banner">
    <h1>漢堡疊疊樂 🍔</h1>
    <div class="hook">不停疊高 · 物理平衡 · 拖曳移動</div>
  </div>
  <div id="hud">
    <span class="pill score">總分 <span id="scoreEl">0</span></span>
    <span class="pill meta">層 <span id="layerEl">0</span></span>
    <span class="pill acc">平衡 <span id="accEl">—</span></span>
  </div>
  <div id="canvasBox">
    <canvas id="game"></canvas>
    <div id="floatMsg"></div>
    <div id="countdown" aria-live="polite"><span class="cd-num"></span></div>
    <div id="controlsHint">拖曳畫布左右移動 · 對齊唔好會倒塌</div>
    <div id="overlay">
      <div class="card" id="startCard">
        <h2>準備好未？🍔</h2>
        <p class="sub">拖曳畫布左右移動，接住跌落嘅材料。冇限時、唔停疊高；重心偏離會物理倒塌。主廚頭銜極罕有。</p>
        <button class="btn btn-primary" id="startBtn">開始疊漢堡</button>
      </div>
      <div id="resultScreen">
        <canvas id="resultCanvas" width="360" height="640"></canvas>
        <div class="result-actions">
          <button class="btn btn-primary" id="dlBtn">下載結果圖</button>
          <button class="btn btn-secondary" id="retryBtn">再試一次</button>
        </div>
        <p class="hint">下載結果圖後可分享挑戰朋友</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  'use strict';

  if (typeof THREE === 'undefined') {
    document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">無法載入 3D 引擎，請檢查網絡後重新整理。</p>';
    return;
  }

  // ── Config (endless physics) ────────────────────────────
  const MISS_THRESHOLD = 0.32;
  const PERFECT_TOL = 0.018;
  const BASE_FALL_SPEED = 3.8;
  const SPEED_INC = 0.18;
  const MAX_FALL_SPEED = 9.5;
  const GRAVITY = 14;
  const BASE_WIDTH = 150;
  const BUN_H = 36;
  const DEPTH = 72;
  const TIP_SUPPORT = 0.22; // COM must stay within middle (1-2*TIP) of base
  const TIP_ANGLE_MAX = 0.55;

  const CORE_TOPPINGS = [
    { id: 'lettuce', name: '生菜', h: 18 },
    { id: 'tomato',  name: '番茄', h: 22 },
    { id: 'cheese',  name: '芝士', h: 16 },
    { id: 'patty',   name: '肉餅', h: 30 },
    { id: 'onion',   name: '洋蔥', h: 16 },
    { id: 'pickle',  name: '酸瓜', h: 16 },
    { id: 'bacon',   name: '煙肉', h: 18 },
    { id: 'egg',     name: '煎蛋', h: 22 },
  ];

  const WILD_TOPPINGS = [
    { id: 'avocado',   name: '牛油果', h: 18 },
    { id: 'mushroom',  name: '蘑菇', h: 18 },
    { id: 'chili',     name: '辣椒', h: 16 },
    { id: 'pineapple', name: '菠蘿', h: 18 },
    { id: 'shrimp',    name: '炸蝦', h: 20 },
    { id: 'corn',      name: '玉米', h: 16 },
    { id: 'sauce',     name: '秘製醬', h: 14 },
  ];

  const TOP_BUN = { id: 'topBun', name: '頂包', h: BUN_H };

  function mulberry32(a) {
    return function () {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function makeRunId() {
    const t = Date.now().toString(36).toUpperCase();
    const r = Math.floor(Math.random() * 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    return 'BS-' + t.slice(-5) + r;
  }

  function shuffleInPlace(arr, rnd) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function pickNextIngredient(rnd, layerIdx, lastId) {
    // Endless: cycle toppings forever; rare topBun as just another layer (not a win)
    const pool = CORE_TOPPINGS.concat(WILD_TOPPINGS);
    if (layerIdx > 0 && layerIdx % 12 === 11 && rnd() < 0.55) {
      return Object.assign({}, TOP_BUN);
    }
    let pick = pool[Math.floor(rnd() * pool.length)];
    let guard = 0;
    while (lastId && pick.id === lastId && guard++ < 8) {
      pick = pool[Math.floor(rnd() * pool.length)];
    }
    return Object.assign({}, pick);
  }

  function getGrade(score, avgAcc, perfects, layers, survived, reason) {
    if (!survived || reason === 'tip' || reason === 'miss') {
      if (layers <= 2) return { title: '散枱', emoji: '😅', color: '#A07858' };
      if (layers <= 5) return { title: '半途倒塌', emoji: '🫠', color: '#C45C26' };
      if (layers <= 10) return { title: '重心失控', emoji: '😤', color: '#E85A8A' };
      if (layers <= 18) return { title: '高塔惜敗', emoji: '🏗️', color: '#FF6B9D' };
      return { title: '摩天遺憾', emoji: '🌆', color: '#C45C26' };
    }
    if (layers >= 30 && avgAcc >= 92 && perfects >= 10) {
      return { title: '傳說廚神', emoji: '👑', color: '#D4A017' };
    }
    if (layers >= 22 && avgAcc >= 88 && perfects >= 7) {
      return { title: '米芝蓮主廚', emoji: '👨‍🍳', color: '#C9A227' };
    }
    if (layers >= 15 && avgAcc >= 84) {
      return { title: '漢堡高手', emoji: '🍔', color: '#FF6B9D' };
    }
    if (layers >= 10) return { title: '穩陣大廚', emoji: '😎', color: '#C45C26' };
    if (layers >= 6) return { title: '合格廚師', emoji: '👍', color: '#8B6B4A' };
    if (layers >= 3) return { title: '學徒', emoji: '📝', color: '#A07858' };
    return { title: '再試多次', emoji: '💪', color: '#A07858' };
  }

  // ── DOM ─────────────────────────────────────────────────
  const canvas = document.getElementById('game');
  const overlay = document.getElementById('overlay');
  const startCard = document.getElementById('startCard');
  const resultScreen = document.getElementById('resultScreen');
  const resultCanvas = document.getElementById('resultCanvas');
  const scoreEl = document.getElementById('scoreEl');
  const layerEl = document.getElementById('layerEl');
  const accEl = document.getElementById('accEl');
  const floatMsg = document.getElementById('floatMsg');
  const controlsHint = document.getElementById('controlsHint');
  const countdownEl = document.getElementById('countdown');
  const countdownNum = countdownEl.querySelector('.cd-num');

  // ── Three.js scene ──────────────────────────────────────
  let W = 320, H = 480, dpr = 1;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFFF5EB);
  scene.fog = new THREE.Fog(0xFFF5EB, 520, 980);

  const camera = new THREE.PerspectiveCamera(38, W / H, 10, 2000);
  const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance',
  });
  renderer.setClearColor(0xFFF5EB, 1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (renderer.outputEncoding !== undefined) {
    renderer.outputEncoding = THREE.sRGBEncoding;
  }

  const amb = new THREE.AmbientLight(0xfff0e0, 0.62);
  scene.add(amb);
  const hemi = new THREE.HemisphereLight(0xfff8f0, 0xd4a574, 0.35);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 0.78);
  dir.position.set(90, 280, 160);
  dir.castShadow = true;
  dir.shadow.mapSize.width = 1024;
  dir.shadow.mapSize.height = 1024;
  dir.shadow.camera.near = 20;
  dir.shadow.camera.far = 700;
  dir.shadow.camera.left = -220;
  dir.shadow.camera.right = 220;
  dir.shadow.camera.top = 220;
  dir.shadow.camera.bottom = -220;
  dir.shadow.bias = -0.0008;
  dir.shadow.radius = 3.5;
  scene.add(dir);

  const fill = new THREE.DirectionalLight(0xffd0b0, 0.28);
  fill.position.set(-120, 120, -40);
  scene.add(fill);

  const tableGroup = new THREE.Group();
  scene.add(tableGroup);

  const plateGeo = new THREE.CylinderGeometry(118, 122, 8, 48);
  const plateMat = new THREE.MeshStandardMaterial({
    color: 0xFFFAF5,
    roughness: 0.45,
    metalness: 0.05,
  });
  const plate = new THREE.Mesh(plateGeo, plateMat);
  plate.receiveShadow = true;
  plate.castShadow = true;
  plate.position.y = -4;
  tableGroup.add(plate);

  const tableTop = new THREE.Mesh(
    new THREE.BoxGeometry(420, 12, 220),
    new THREE.MeshStandardMaterial({ color: 0xE8C9A0, roughness: 0.85 })
  );
  tableTop.position.y = -14;
  tableTop.receiveShadow = true;
  tableGroup.add(tableTop);

  const pieceRoot = new THREE.Group();
  scene.add(pieceRoot);

  const particleRoot = new THREE.Group();
  scene.add(particleRoot);

  // ── Materials / mesh factory ────────────────────────────
  function mat(color, opts) {
    opts = opts || {};
    return new THREE.MeshStandardMaterial({
      color: color,
      roughness: opts.roughness != null ? opts.roughness : 0.55,
      metalness: opts.metalness != null ? opts.metalness : 0.05,
      flatShading: !!opts.flat,
      transparent: !!opts.transparent,
      opacity: opts.opacity != null ? opts.opacity : 1,
    });
  }

  function addSesame(group, radius, y) {
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 + (i % 2) * 0.2;
      const r = radius * (0.25 + (i % 3) * 0.18);
      const seed = new THREE.Mesh(
        new THREE.SphereGeometry(2.2, 6, 6),
        mat(0xF5E6C8, { roughness: 0.7 })
      );
      seed.position.set(Math.cos(a) * r, y, Math.sin(a) * r * 0.55);
      seed.scale.set(1, 0.55, 1.4);
      seed.castShadow = true;
      group.add(seed);
    }
  }

  function createPieceMesh(id, w, h) {
    const g = new THREE.Group();
    const R = Math.max(10, w / 2);
    const depth = Math.min(DEPTH, Math.max(36, w * 0.42));
    const ry = depth / 2;

    function cyl(rt, rb, hh, segs, material, y) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, hh, segs || 28), material);
      m.position.y = y != null ? y : 0;
      m.castShadow = true;
      m.receiveShadow = true;
      g.add(m);
      return m;
    }

    if (id === 'bottomBun') {
      cyl(R * 0.98, R, h * 0.72, 32, mat(0xE09440, { roughness: 0.7 }), -h * 0.05);
      cyl(R * 0.92, R * 0.96, h * 0.28, 32, mat(0xF2BC6A, { roughness: 0.55 }), h * 0.28);
    } else if (id === 'topBun') {
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(R * 0.98, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.52),
        mat(0xE8A04A, { roughness: 0.55 })
      );
      dome.position.y = -h * 0.05;
      dome.scale.set(1, (h * 1.15) / R, depth / (R * 2));
      dome.castShadow = true;
      dome.receiveShadow = true;
      g.add(dome);
      cyl(R * 0.95, R, h * 0.22, 32, mat(0xD4893A, { roughness: 0.65 }), -h * 0.32);
      addSesame(g, R * 0.75, h * 0.22);
    } else if (id === 'lettuce' || id === 'lettuce2') {
      const leaf = mat(0x7CB342, { roughness: 0.8, flat: true });
      for (let i = 0; i < 5; i++) {
        const leafM = new THREE.Mesh(
          new THREE.TorusGeometry(R * (0.55 + i * 0.08), h * 0.28, 6, 18),
          leaf
        );
        leafM.rotation.x = Math.PI / 2;
        leafM.rotation.z = i * 0.35;
        leafM.position.y = (i - 2) * 1.2;
        leafM.scale.set(1, depth / (R * 1.6), 1);
        leafM.castShadow = true;
        g.add(leafM);
      }
    } else if (id === 'tomato') {
      cyl(R, R, h * 0.85, 28, mat(0xE53935, { roughness: 0.4 }), 0);
      cyl(R * 0.55, R * 0.55, h * 0.2, 12, mat(0xFFEB3B, { roughness: 0.5 }), 0);
    } else if (id === 'cheese') {
      const cheese = new THREE.Mesh(
        new THREE.BoxGeometry(w * 1.12, h * 0.7, depth * 1.05),
        mat(0xFFC107, { roughness: 0.45 })
      );
      cheese.castShadow = true;
      cheese.receiveShadow = true;
      g.add(cheese);
      const drip = new THREE.Mesh(
        new THREE.BoxGeometry(w * 0.25, h * 0.9, depth * 0.2),
        mat(0xFFB300, { roughness: 0.45 })
      );
      drip.position.set(w * 0.35, -h * 0.35, depth * 0.2);
      drip.castShadow = true;
      g.add(drip);
    } else if (id === 'patty') {
      cyl(R, R * 0.98, h * 0.9, 24, mat(0x5D4037, { roughness: 0.9, flat: true }), 0);
      const grill = mat(0x3E2723, { roughness: 1 });
      for (let i = -1; i <= 1; i++) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(w * 0.85, 1.5, depth * 0.15), grill);
        bar.position.set(0, i * (h * 0.22), ry * 0.55);
        g.add(bar);
      }
    } else if (id === 'onion') {
      cyl(R, R, h * 0.75, 28, mat(0xF8BBD0, { roughness: 0.5 }), 0);
      for (let i = 0; i < 2; i++) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(R * (0.45 + i * 0.2), 1.2, 6, 24),
          mat(0xF48FB1, { roughness: 0.5 })
        );
        ring.rotation.x = Math.PI / 2;
        ring.position.y = (i - 0.5) * 2;
        ring.scale.z = depth / (R * 2);
        g.add(ring);
      }
    } else if (id === 'pickle') {
      cyl(R * 0.95, R * 0.95, h * 0.7, 16, mat(0x689F38, { roughness: 0.65 }), 0);
      for (let i = 0; i < 6; i++) {
        const bump = new THREE.Mesh(new THREE.SphereGeometry(2.5, 6, 6), mat(0x9CCC65));
        const a = (i / 6) * Math.PI * 2;
        bump.position.set(Math.cos(a) * R * 0.55, 0, Math.sin(a) * ry * 0.5);
        g.add(bump);
      }
    } else if (id === 'bacon') {
      for (let i = 0; i < 3; i++) {
        const strip = new THREE.Mesh(
          new THREE.BoxGeometry(w * 0.95, h * 0.22, depth * 0.7),
          mat(i % 2 ? 0xC62828 : 0xFFCC80, { roughness: 0.6 })
        );
        strip.position.y = (i - 1) * (h * 0.28);
        strip.rotation.z = (i - 1) * 0.04;
        strip.castShadow = true;
        g.add(strip);
      }
    } else if (id === 'egg') {
      const white = new THREE.Mesh(
        new THREE.SphereGeometry(R * 0.95, 24, 16),
        mat(0xFFFAF0, { roughness: 0.4 })
      );
      white.scale.set(1, h / (R * 1.6), depth / (R * 2));
      white.castShadow = true;
      white.receiveShadow = true;
      g.add(white);
      const yolk = new THREE.Mesh(
        new THREE.SphereGeometry(Math.min(R * 0.38, 18), 16, 16),
        mat(0xFFC107, { roughness: 0.35 })
      );
      yolk.scale.set(1, 0.55, 1);
      yolk.position.y = h * 0.12;
      yolk.castShadow = true;
      g.add(yolk);
    } else if (id === 'avocado') {
      cyl(R, R, h * 0.75, 28, mat(0x8BC34A, { roughness: 0.55 }), 0);
      const pit = new THREE.Mesh(new THREE.SphereGeometry(R * 0.22, 12, 12), mat(0xF9A825));
      pit.scale.y = 0.5;
      g.add(pit);
    } else if (id === 'mushroom') {
      cyl(R * 0.9, R * 0.9, h * 0.7, 20, mat(0xBCAAA4, { roughness: 0.7 }), 0);
      for (let i = 0; i < 4; i++) {
        const spot = new THREE.Mesh(new THREE.SphereGeometry(3, 6, 6), mat(0x795548, { roughness: 0.8 }));
        const a = (i / 4) * Math.PI * 2;
        spot.position.set(Math.cos(a) * R * 0.4, h * 0.15, Math.sin(a) * ry * 0.35);
        g.add(spot);
      }
    } else if (id === 'chili') {
      const chiliGeo = typeof THREE.CapsuleGeometry === 'function'
        ? new THREE.CapsuleGeometry(R * 0.35, w * 0.55, 6, 12)
        : new THREE.CylinderGeometry(R * 0.35, R * 0.28, w * 0.7, 12);
      const body = new THREE.Mesh(
        chiliGeo,
        mat(0xD32F2F, { roughness: 0.45 })
      );
      body.rotation.z = Math.PI / 2;
      body.castShadow = true;
      g.add(body);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.5, 8, 6), mat(0x2E7D32));
      stem.position.set(-w * 0.32, h * 0.2, 0);
      g.add(stem);
    } else if (id === 'pineapple') {
      cyl(R, R, h * 0.75, 16, mat(0xFFB300, { roughness: 0.55, flat: true }), 0);
      for (let i = 0; i < 4; i++) {
        const line = new THREE.Mesh(
          new THREE.BoxGeometry(w * 0.85, 1.2, depth * 0.1),
          mat(0xFF8F00)
        );
        line.position.set(0, (i - 1.5) * 3, ry * 0.5);
        g.add(line);
      }
    } else if (id === 'shrimp') {
      const body = new THREE.Mesh(
        new THREE.TorusGeometry(R * 0.55, h * 0.35, 8, 16, Math.PI * 1.2),
        mat(0xFF7043, { roughness: 0.5 })
      );
      body.rotation.y = Math.PI / 2;
      body.castShadow = true;
      g.add(body);
    } else if (id === 'corn') {
      cyl(R * 0.95, R * 0.95, h * 0.7, 16, mat(0xFFD54F, { roughness: 0.55 }), 0);
      for (let row = 0; row < 2; row++) {
        for (let i = 0; i < 6; i++) {
          const kernel = new THREE.Mesh(new THREE.SphereGeometry(2.8, 6, 6), mat(0xFFC107));
          kernel.position.set(
            -R * 0.6 + i * (R * 0.24),
            (row - 0.5) * 4,
            ry * 0.45
          );
          g.add(kernel);
        }
      }
    } else if (id === 'sauce') {
      const sauce = new THREE.Mesh(
        new THREE.SphereGeometry(R * 0.9, 16, 12),
        mat(0xE64A19, { roughness: 0.35 })
      );
      sauce.scale.set(1.05, h / (R * 1.8), depth / (R * 2));
      sauce.position.y = -h * 0.1;
      sauce.castShadow = true;
      g.add(sauce);
    } else {
      cyl(R, R, h * 0.8, 20, mat(0xA1887F, { roughness: 0.7 }), 0);
    }

    // Flatten into burger-layer depth (Z) for consistent stack look
    g.userData.baseScaleZ = depth / Math.max(DEPTH, 1);
    return g;
  }

  function syncMesh(piece) {
    if (!piece.mesh) return;
    const cx = piece.x + piece.w / 2;
    const worldY = tableYWorld + (tableY - piece.y - piece.h / 2);
    piece.mesh.position.set(cx - W / 2, worldY, 0);
    const s = piece.w / BASE_WIDTH;
    piece.mesh.scale.set(s, 1, Math.max(0.55, s * 0.95));
    const lean = piece.lean || 0;
    piece.mesh.rotation.z = lean;
  }

  // ── State ───────────────────────────────────────────────
  let state = 'start';
  let stack = [];
  let falling = null;
  let score = 0;
  let lastAcc = null;
  let perfects = 0;
  let accSum = 0;
  let placed = 0;
  let nextIdx = 0;
  let keys = {};
  let dragX = null;
  let dragPointerId = null;
  let dragMode = null; // 'abs' | 'rel'
  let lastPointerX = 0;
  let countdownTimer = null;
  let floatTimer = null;
  let animId = null;
  let fallSpeed = BASE_FALL_SPEED;
  let tableY = 0;
  let tableYWorld = 4;
  let shake = 0;
  let particles = [];
  let lastTickTs = 0;
  let endReason = null;
  let runId = '';
  let runSeed = 0;
  let rnd = Math.random;
  let lastIngredientId = null;
  let tipDir = 0;
  let tipAngle = 0;
  let tipOmega = 0;
  let camLookY = 0;
  let camPosY = 0;
  let camPosZ = 0;
  let collapsing = [];

  function stackHeightWorld() {
    if (!stack.length) return 0;
    const top = stack[stack.length - 1];
    return tableYWorld + (tableY - top.y);
  }

  function updateCamera(force) {
    camera.aspect = W / Math.max(1, H);
    camera.fov = H < 420 ? 42 : 38;
    const baseLook = H * 0.12;
    const basePos = H * 0.22;
    const baseZ = Math.max(400, H * 0.78);
    const hWorld = stackHeightWorld();
    const follow = Math.max(0, hWorld - tableYWorld - 40) * 0.55;
    const targetLook = baseLook + follow;
    const targetPos = basePos + follow * 0.85;
    const targetZ = baseZ + follow * 0.35;
    if (force || !camPosZ) {
      camLookY = targetLook;
      camPosY = targetPos;
      camPosZ = targetZ;
    } else {
      camLookY += (targetLook - camLookY) * 0.08;
      camPosY += (targetPos - camPosY) * 0.08;
      camPosZ += (targetZ - camPosZ) * 0.08;
    }
    camera.position.set(0, camPosY, camPosZ);
    camera.lookAt(0, camLookY, 0);
    camera.updateProjectionMatrix();

    dir.shadow.camera.left = -W * 0.55;
    dir.shadow.camera.right = W * 0.55;
    dir.shadow.camera.top = H * 0.55 + follow;
    dir.shadow.camera.bottom = -H * 0.2;
    dir.shadow.camera.updateProjectionMatrix();
    dir.position.set(W * 0.25, H * 0.7 + follow, 180);
  }

  function resize() {
    const box = document.getElementById('canvasBox');
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = box.clientWidth;
    H = box.clientHeight;
    renderer.setPixelRatio(dpr);
    renderer.setSize(W, H, false);
    // Keep plate above browser chrome
    const bottomClear = Math.max(48, Math.round(H * 0.08));
    tableY = H - bottomClear;
    tableGroup.position.set(0, tableYWorld - 4, 0);
    updateCamera(true);
    if (stack.length) {
      let y = tableY;
      for (let i = 0; i < stack.length; i++) {
        stack[i].y = y - stack[i].h;
        y = stack[i].y;
        syncMesh(stack[i]);
      }
    }
    if (falling) syncMesh(falling);
  }
  window.addEventListener('resize', resize);

  function canControl() {
    return (state === 'playing' || state === 'falling') && state !== 'tipping';
  }

  function moveBase(nx) {
    if (!stack.length || !canControl()) return;
    const base = stack[0];
    const half = base.w / 2;
    nx = Math.max(half + 8, Math.min(W - half - 8, nx));
    const dx = nx - (base.x + half);
    for (const p of stack) {
      p.x += dx;
      if (p.cx != null) p.cx += dx;
      else p.cx = p.x + p.w / 2;
      syncMesh(p);
    }
  }

  function nudgeBase(px) {
    if (!stack.length || !canControl()) return;
    const base = stack[0];
    moveBase(base.x + base.w / 2 + px);
  }

  function clearDrag() {
    dragX = null;
    dragPointerId = null;
    dragMode = null;
  }

  function onCanvasPointerDown(e) {
    if (!canControl()) return;
    if (e.target && e.target.closest && e.target.closest('#overlay, button')) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    dragPointerId = e.pointerId;
    dragX = e.clientX;
    lastPointerX = e.clientX;
    dragMode = 'abs';
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    if (!stack.length) return;
    const base = stack[0];
    const baseCx = base.x + base.w / 2;
    const blend = 0.65;
    moveBase(baseCx + (cx - baseCx) * blend);
  }

  function onCanvasPointerMove(e) {
    if (dragX == null || (dragPointerId != null && e.pointerId !== dragPointerId)) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    lastPointerX = e.clientX;
    if (!stack.length) return;
    moveBase(cx);
    dragX = e.clientX;
  }

  function onCanvasPointerUp(e) {
    if (dragPointerId != null && e.pointerId !== dragPointerId) return;
    clearDrag();
  }

  canvas.addEventListener('pointerdown', onCanvasPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onCanvasPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onCanvasPointerUp);
  canvas.addEventListener('pointercancel', onCanvasPointerUp);
  canvas.addEventListener('lostpointercapture', clearDrag);

  // Prevent iOS/Chrome page scroll/zoom while playing
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    if (state === 'playing' || state === 'falling' || state === 'countdown') e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function formatHkTime(d) {
    try {
      return new Intl.DateTimeFormat('zh-HK', {
        timeZone: 'Asia/Hong_Kong',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false,
      }).format(d) + ' (HK)';
    } catch (e) {
      return d.toISOString();
    }
  }

  function clearPieces() {
    while (pieceRoot.children.length) {
      const ch = pieceRoot.children[0];
      pieceRoot.remove(ch);
      ch.traverse(function (obj) {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(function (m) { m.dispose(); });
          else obj.material.dispose();
        }
      });
    }
    while (particleRoot.children.length) {
      particleRoot.remove(particleRoot.children[0]);
    }
    particles = [];
  }

  function attachMesh(piece) {
    const mesh = createPieceMesh(piece.id, piece.w, piece.h);
    piece.mesh = mesh;
    pieceRoot.add(mesh);
    syncMesh(piece);
  }

  function resetGame() {
    clearPieces();
    score = 0; lastAcc = null; perfects = 0; accSum = 0; placed = 0;
    nextIdx = 0; fallSpeed = BASE_FALL_SPEED; shake = 0;
    endReason = null; lastTickTs = performance.now();
    lastIngredientId = null;
    tipDir = 0; tipAngle = 0; tipOmega = 0;
    collapsing = [];

    runId = makeRunId();
    runSeed = (Date.now() ^ (Math.floor(Math.random() * 0x7fffffff))) >>> 0;
    rnd = mulberry32(runSeed || 1);

    updateHUD();
    layerEl.textContent = '0';

    const bw = BASE_WIDTH;
    const base = {
      x: (W - bw) / 2,
      y: tableY - BUN_H,
      w: bw,
      h: BUN_H,
      id: 'bottomBun',
      name: '底包',
      lean: 0,
      cx: W / 2,
    };
    stack = [base];
    attachMesh(base);
    falling = null;
    state = 'countdown';
    controlsHint.style.opacity = '0.85';
    updateCamera(true);
  }

  function beginPlayAfterCountdown() {
    if (state !== 'countdown') return;
    state = 'playing';
    lastTickTs = performance.now();
    spawnNext();
  }

  function runCountdown(thenPlay) {
    if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
    const steps = ['3', '2', '1', 'GO!'];
    let i = 0;
    countdownEl.classList.add('show');
    function showStep() {
      countdownNum.textContent = steps[i];
      // retrigger animation
      countdownNum.style.animation = 'none';
      void countdownNum.offsetWidth;
      countdownNum.style.animation = '';
      const delay = steps[i] === 'GO!' ? 420 : 700;
      i++;
      if (i < steps.length) {
        countdownTimer = setTimeout(showStep, delay);
      } else {
        countdownTimer = setTimeout(() => {
          countdownEl.classList.remove('show');
          countdownNum.textContent = '';
          countdownTimer = null;
          if (thenPlay) thenPlay();
        }, delay);
      }
    }
    showStep();
  }

  function spawnNext() {
    if (state === 'over' || state === 'result' || state === 'tipping') return;
    const ing = pickNextIngredient(rnd, nextIdx, lastIngredientId);
    lastIngredientId = ing.id;
    const top = stack[stack.length - 1];
    const w = top.w;
    const h = ing.h;
    // Spawn above current camera view
    const spawnY = Math.min(-h - 10, stack[stack.length - 1].y - H * 0.55);
    falling = {
      x: Math.random() * (W - w - 40) + 20,
      y: spawnY,
      w, h,
      id: ing.id,
      name: ing.name,
      vy: fallSpeed,
      lean: 0,
    };
    attachMesh(falling);
    state = 'falling';
    nextIdx++;
    layerEl.textContent = String(nextIdx);
  }

  function computeCOM() {
    let com = 0, mass = 0;
    for (const p of stack) {
      const m = Math.max(1, p.w * p.h);
      const cx = p.cx != null ? p.cx : (p.x + p.w / 2);
      com += cx * m;
      mass += m;
    }
    return mass > 0 ? com / mass : W / 2;
  }

  function balanceLabel(com) {
    const base = stack[0];
    const mid = base.x + base.w / 2;
    const half = base.w / 2;
    const off = Math.abs(com - mid) / Math.max(1, half);
    const pct = Math.max(0, Math.round((1 - off) * 100));
    return pct;
  }

  function startTip(dir) {
    if (state === 'tipping' || state === 'over' || state === 'result') return;
    tipDir = dir < 0 ? -1 : 1;
    tipOmega = tipDir * 0.9;
    tipAngle = tipDir * 0.04;
    state = 'tipping';
    endReason = 'tip';
    showFloat('倒塌！', '#E85A8A');
    shake = 14;
    if (falling && falling.mesh) {
      pieceRoot.remove(falling.mesh);
      falling = null;
    }
    // Convert stack into collapsing debris with velocity
    collapsing = stack.map((p, i) => {
      const cx = p.cx != null ? p.cx : (p.x + p.w / 2);
      return {
        mesh: p.mesh,
        vx: tipDir * (2.2 + i * 0.35) + (Math.random() - 0.5) * 1.5,
        vy: 1.2 + Math.random() * 2,
        omega: tipDir * (0.04 + Math.random() * 0.06),
        life: 90 + i * 4,
      };
    });
    stack = [];
    setTimeout(() => endGame(false), 1100);
  }

  function showFloat(text, color) {
    floatMsg.textContent = text;
    floatMsg.style.color = color || '#FF6B9D';
    floatMsg.classList.add('show');
    clearTimeout(floatTimer);
    floatTimer = setTimeout(() => floatMsg.classList.remove('show'), 700);
  }

  function landPiece() {
    const top = stack[stack.length - 1];
    const f = falling;

    const left = Math.max(f.x, top.x);
    const right = Math.min(f.x + f.w, top.x + top.w);
    const overlap = Math.max(0, right - left);
    const ratio = overlap / Math.max(1, f.w);
    const accPct = Math.round(ratio * 100);

    const fCx = f.x + f.w / 2;
    const tCx = top.x + top.w / 2;
    const centerOff = fCx - tCx;
    const centerRatio = Math.abs(centerOff) / Math.max(1, top.w);

    if (ratio < MISS_THRESHOLD) {
      lastAcc = accPct;
      accEl.textContent = balanceLabel(computeCOM()) + '%';
      showFloat('接唔到！', '#E85A8A');
      spawnMissParticles(f);
      shake = 12;
      if (f.mesh) pieceRoot.remove(f.mesh);
      falling = null;
      // Bad miss can also knock the tower if already leaning
      const com = computeCOM();
      const base = stack[0];
      const mid = base.x + base.w / 2;
      if (Math.abs(com - mid) > base.w * 0.28) {
        startTip(com < mid ? -1 : 1);
      } else {
        state = 'over';
        endReason = 'miss';
        setTimeout(() => endGame(false), 900);
      }
      return;
    }

    // Support shrinks to overlap (physics contact surface)
    const newW = Math.max(22, overlap);
    const newX = left;
    const newY = top.y - f.h;
    const newCx = newX + newW / 2;

    // Lean from offset relative to piece below
    const leanAdd = (centerOff / Math.max(1, top.w)) * 0.22;
    const prevLean = top.lean || 0;
    const newLean = prevLean + leanAdd;

    let pts = Math.round(ratio * 70);
    let label = '好！';
    let color = '#C45C26';
    if (centerRatio <= PERFECT_TOL && ratio >= 0.97) {
      pts = Math.round(pts * 1.45) + 20;
      perfects++;
      label = '完美！';
      color = '#FF6B9D';
      spawnPerfectParticles(fCx, newY);
    } else if (ratio >= 0.88) {
      pts = Math.round(pts * 1.1);
      label = '穩陣！';
      color = '#FF8A5B';
    } else if (ratio < 0.52) {
      pts = Math.round(pts * 0.7);
      label = '晃！';
      color = '#A07858';
    }

    pts += Math.floor(nextIdx * 3);

    score += pts;
    lastAcc = accPct;
    accSum += accPct;
    placed++;

    if (f.mesh) {
      pieceRoot.remove(f.mesh);
      f.mesh = null;
    }

    const landed = {
      x: newX,
      y: newY,
      w: newW,
      h: f.h,
      id: f.id,
      name: f.name,
      lean: newLean,
      cx: newCx,
    };
    stack.push(landed);
    attachMesh(landed);

    // Propagate slight visual lean up the tower
    for (let i = 1; i < stack.length; i++) {
      const below = stack[i - 1];
      const cur = stack[i];
      const off = (cur.cx - below.cx) / Math.max(1, below.w);
      cur.lean = (below.lean || 0) + off * 0.18;
      syncMesh(cur);
    }

    falling = null;
    fallSpeed = Math.min(MAX_FALL_SPEED, BASE_FALL_SPEED + SPEED_INC * nextIdx);
    state = 'playing';

    const com = computeCOM();
    const bal = balanceLabel(com);
    accEl.textContent = bal + '%';
    updateHUD();
    showFloat(label + ' +' + pts, color);

    // Physics tip check: COM outside support of base
    const base = stack[0];
    const supportL = base.x + base.w * TIP_SUPPORT;
    const supportR = base.x + base.w * (1 - TIP_SUPPORT);
    if (com < supportL || com > supportR || Math.abs(newLean) > TIP_ANGLE_MAX) {
      startTip(com < (base.x + base.w / 2) ? -1 : 1);
      return;
    }

    updateCamera(false);

    // Keep stack in view by shifting down if needed (camera also follows)
    const topY = stack[stack.length - 1].y;
    if (topY < 60) {
      const shift = 60 - topY;
      for (const p of stack) {
        p.y += shift;
        syncMesh(p);
      }
    }

    setTimeout(spawnNext, 260);
  }

  function updateHUD() {
    scoreEl.textContent = score;
    accEl.textContent = lastAcc == null ? '—' : lastAcc + '%';
  }

  function endGame(survived) {
    state = 'result';
    controlsHint.style.opacity = '0';
    clearDrag();
    if (countdownTimer) { clearTimeout(countdownTimer); countdownTimer = null; }
    countdownEl.classList.remove('show');
    const avgAcc = placed > 0 ? Math.round(accSum / placed) : 0;
    const reason = endReason || (survived ? 'complete' : 'miss');
    const grade = getGrade(score, avgAcc, perfects, placed, survived, reason);
    drawResultCard(survived, avgAcc, grade, reason);
    startCard.style.display = 'none';
    resultScreen.classList.add('show');
    overlay.classList.remove('hidden');
  }

  function spawnPerfectParticles(x, y) {
    for (let i = 0; i < 12; i++) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(2.5 + Math.random() * 2, 6, 6),
        mat([0xFF6B9D, 0xFFD700, 0xFF8A5B, 0xffffff][i % 4])
      );
      const worldY = tableYWorld + (tableY - y);
      mesh.position.set(x - W / 2, worldY, 0);
      particleRoot.add(mesh);
      particles.push({
        mesh,
        vx: (Math.random() - 0.5) * 6,
        vy: Math.random() * 5 + 2,
        vz: (Math.random() - 0.5) * 4,
        life: 40 + Math.random() * 20,
      });
    }
  }

  function spawnMissParticles(f) {
    for (let i = 0; i < 10; i++) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(2 + Math.random() * 2, 6, 6),
        mat(0x8B6B4A)
      );
      mesh.position.set(f.x + f.w / 2 - W / 2, tableYWorld + (tableY - f.y - f.h / 2), 0);
      particleRoot.add(mesh);
      particles.push({
        mesh,
        vx: (Math.random() - 0.5) * 8,
        vy: Math.random() * 3 + 1,
        vz: (Math.random() - 0.5) * 5,
        life: 35,
      });
    }
  }

  function roundRect(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  // 2D mini stack for share card (simple dimensional slabs)
  function drawIngredientOn(c, p) {
    c.save();
    const { x, y, w, h, id } = p;
    const cx = x + w / 2;
    const d = Math.min(5, Math.max(3, h * 0.28));

    c.fillStyle = 'rgba(60,30,10,0.18)';
    c.beginPath();
    c.ellipse(cx, y + h + 3, w * 0.48, 4, 0, 0, Math.PI * 2);
    c.fill();

    const colors = {
      bottomBun: ['#F2BC6A', '#C87830'],
      topBun: ['#F5C878', '#D4893A'],
      lettuce: ['#9CCC65', '#558B2F'],
      tomato: ['#EF5350', '#C62828'],
      cheese: ['#FFE082', '#FFB300'],
      patty: ['#8D6E63', '#4E342E'],
      onion: ['#FCE4EC', '#F8BBD0'],
      pickle: ['#9CCC65', '#558B2F'],
      bacon: ['#E57373', '#C62828'],
      egg: ['#FFFAF0', '#F0E6C8'],
      avocado: ['#AED581', '#7CB342'],
      mushroom: ['#EFEBE9', '#BCAAA4'],
      chili: ['#FF7043', '#D32F2F'],
      pineapple: ['#FFE082', '#FFB300'],
      shrimp: ['#FFAB91', '#FF7043'],
      corn: ['#FFF59D', '#FFD54F'],
      sauce: ['#FF8A65', '#E64A19'],
    };
    const col = colors[id] || ['#A1887F', '#6D4C41'];

    c.fillStyle = col[1];
    c.beginPath();
    c.moveTo(x, y + h);
    c.lineTo(x + w, y + h);
    c.lineTo(x + w - 2, y + h + d);
    c.lineTo(x + 2, y + h + d);
    c.closePath();
    c.fill();

    const g = c.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, col[0]);
    g.addColorStop(1, col[1]);
    c.fillStyle = g;
    if (id === 'topBun') {
      c.beginPath();
      c.ellipse(cx, y + h * 0.55, w / 2, h * 0.55, 0, Math.PI, 0);
      c.lineTo(x + w, y + h);
      c.lineTo(x, y + h);
      c.closePath();
      c.fill();
    } else {
      const r = id === 'tomato' || id === 'onion' || id === 'egg' ? h / 2 : 8;
      roundRect(c, x, y, w, h, r);
      c.fill();
    }
    c.restore();
  }

  function drawMiniStack(rctx, cx, cy) {
    if (!stack.length) return;
    const scale = 0.5;
    const totalH = stack.reduce((s, p) => s + p.h, 0) * scale;
    let y = cy + totalH / 2;
    const avgCx = stack.reduce((s, p) => s + p.x + p.w / 2, 0) / stack.length;
    for (let i = 0; i < stack.length; i++) {
      const p = stack[i];
      const mw = p.w * scale;
      const mh = p.h * scale;
      const mx = cx - mw / 2 + (p.x + p.w / 2 - avgCx) * scale * 0.3;
      y -= mh;
      drawIngredientOn(rctx, { x: mx, y, w: mw, h: mh, id: p.id });
    }
  }

  function drawResultCard(survived, avgAcc, grade, reason) {
    const rc = resultCanvas;
    const rctx = rc.getContext('2d');
    const RW = 360, RH = 640;
    rc.width = RW; rc.height = RH;

    const bg = rctx.createLinearGradient(0, 0, 0, RH);
    bg.addColorStop(0, '#FF6B9D');
    bg.addColorStop(0.16, '#FF8FB5');
    bg.addColorStop(0.16, '#FFF5EB');
    bg.addColorStop(1, '#FFE8D6');
    rctx.fillStyle = bg;
    rctx.fillRect(0, 0, RW, RH);

    rctx.fillStyle = '#fff';
    rctx.font = 'bold 24px "PingFang TC", "Noto Sans TC", sans-serif';
    rctx.textAlign = 'center';
    rctx.fillText('漢堡疊疊樂 🍔', RW / 2, 40);

    rctx.fillStyle = '#FFF9F2';
    roundRect(rctx, 20, 58, RW - 40, 540, 20);
    rctx.fill();
    rctx.strokeStyle = '#FFE0C2';
    rctx.lineWidth = 2;
    rctx.stroke();

    rctx.fillStyle = grade.color;
    rctx.font = 'bold 22px "PingFang TC", "Noto Sans TC", sans-serif';
    rctx.fillText(grade.emoji + ' ' + grade.title, RW / 2, 100);

    rctx.fillStyle = '#C45C26';
    rctx.font = 'bold 58px "PingFang TC", system-ui, sans-serif';
    rctx.fillText(String(score), RW / 2, 175);
    rctx.font = '15px "PingFang TC", sans-serif';
    rctx.fillStyle = '#8B6B4A';
    rctx.fillText('總分', RW / 2, 198);

    drawMiniStack(rctx, RW / 2, 270);

    let resultText = '完成';
    if (reason === 'tip') resultText = '物理倒塌';
    else if (!survived) resultText = '散枱出局';

    const ended = new Date();
    const lines = [
      { label: '層數', value: String(placed) },
      { label: '平均平衡', value: avgAcc + '%' },
      { label: '完美次數', value: String(perfects) },
      { label: '結果', value: resultText },
      { label: 'Run ID', value: runId },
    ];
    rctx.font = '13px "PingFang TC", sans-serif';
    rctx.textAlign = 'left';
    let ly = 360;
    lines.forEach((ln) => {
      rctx.fillStyle = '#A07858';
      rctx.fillText(ln.label, 48, ly);
      rctx.fillStyle = '#3D2914';
      rctx.textAlign = 'right';
      rctx.font = 'bold 13px "PingFang TC", sans-serif';
      rctx.fillText(ln.value, RW - 48, ly);
      rctx.textAlign = 'left';
      rctx.font = '13px "PingFang TC", sans-serif';
      ly += 28;
    });

    rctx.textAlign = 'center';
    rctx.fillStyle = '#A07858';
    rctx.font = '11px "PingFang TC", sans-serif';
    rctx.fillText(formatHkTime(ended), RW / 2, 560);
  }

  function tick(ts) {
    if (!lastTickTs) lastTickTs = ts;
    const dt = Math.min(0.05, (ts - lastTickTs) / 1000);
    lastTickTs = ts;

    if (state === 'playing' || state === 'falling') {
      let dx = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 5.2;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 5.2;
      if (dx && stack.length) {
        const base = stack[0];
        moveBase(base.x + base.w / 2 + dx);
        // Moving base shifts COM relative to support — live balance check
        const com = computeCOM();
        const bal = balanceLabel(com);
        accEl.textContent = bal + '%';
        const b = stack[0];
        const supportL = b.x + b.w * TIP_SUPPORT;
        const supportR = b.x + b.w * (1 - TIP_SUPPORT);
        if (stack.length >= 3 && (com < supportL || com > supportR)) {
          startTip(com < (b.x + b.w / 2) ? -1 : 1);
        }
      }
    }

    if (state === 'falling' && falling && stack.length) {
      falling.vy = Math.min(MAX_FALL_SPEED + 2, falling.vy + GRAVITY * dt);
      falling.y += falling.vy * (60 * dt); // scale to prior per-frame units ~60fps
      syncMesh(falling);
      const top = stack[stack.length - 1];
      if (falling.y + falling.h >= top.y) {
        falling.y = top.y - falling.h;
        syncMesh(falling);
        landPiece();
      }
    }

    if (state === 'tipping') {
      tipOmega += tipDir * 2.8 * dt;
      tipAngle += tipOmega * dt;
      for (let i = collapsing.length - 1; i >= 0; i--) {
        const c = collapsing[i];
        if (!c.mesh) continue;
        c.mesh.position.x += c.vx;
        c.mesh.position.y -= c.vy;
        c.vy += 0.22;
        c.mesh.rotation.z += c.omega;
        c.life--;
        if (c.life <= 0) {
          pieceRoot.remove(c.mesh);
          collapsing.splice(i, 1);
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.mesh.position.x += p.vx;
      p.mesh.position.y += p.vy;
      p.mesh.position.z += p.vz;
      p.vy -= 0.18;
      p.life--;
      if (p.life <= 0) {
        particleRoot.remove(p.mesh);
        particles.splice(i, 1);
      }
    }

    if (shake > 0) shake *= 0.85;
    if (shake < 0.3) shake = 0;

    const shakeX = shake ? (Math.random() - 0.5) * shake * 0.4 : 0;
    const shakeY = shake ? (Math.random() - 0.5) * shake * 0.25 : 0;
    pieceRoot.position.x = shakeX;
    pieceRoot.position.y = shakeY;

    if (state === 'playing' || state === 'falling' || state === 'tipping') {
      updateCamera(false);
    }

    renderer.render(scene, camera);
    animId = requestAnimationFrame(tick);
  }

  function startRound() {
    overlay.classList.add('hidden');
    resultScreen.classList.remove('show');
    startCard.style.display = 'block';
    resize();
    resetGame();
    runCountdown(beginPlayAfterCountdown);
  }

  document.getElementById('startBtn').addEventListener('click', startRound);
  document.getElementById('retryBtn').addEventListener('click', startRound);

  document.getElementById('dlBtn').addEventListener('click', () => {
    const url = resultCanvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'burger-stack-' + (runId || 'result') + '.png';
    a.click();
  });

  resize();
  renderer.render(scene, camera);
  animId = requestAnimationFrame(tick);
})();
</script>
</body>
