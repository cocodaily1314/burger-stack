<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>漢堡疊疊樂 🍔</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: #FFF5EB;
    color: #3D2914;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #FFE8D6 0%, #FFF5EB 40%, #FFEFD9 100%);
    box-shadow: 0 0 40px rgba(180,100,60,0.12);
    padding-top: env(safe-area-inset-top, 0);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  #banner {
    flex: 0 0 auto;
    background: linear-gradient(135deg, #FF6B9D 0%, #FF8FB5 50%, #FF6B9D 100%);
    color: #fff;
    text-align: center;
    padding: 10px 16px 12px;
    box-shadow: 0 4px 16px rgba(255,107,157,0.35);
    z-index: 30;
    position: relative;
  }
  #banner h1 {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-shadow: 0 2px 0 rgba(0,0,0,0.1);
  }
  #banner .hook {
    font-size: 0.78rem;
    opacity: 0.95;
    margin-top: 3px;
    font-weight: 500;
  }
  /* HUD stays above canvas + overlays so 總分 never covered */
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 6px;
    padding: 8px 10px 6px;
    font-size: 0.8rem;
    font-weight: 600;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border-bottom: none;
    z-index: 40;
    position: relative;
  }
  #hud .pill {
    background: #fff;
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: 0 2px 6px rgba(180,100,60,0.12);
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #hud .pill.score {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.95rem;
    font-weight: 800;
    color: #C45C26;
    background: linear-gradient(135deg, #FFF8F0, #FFE8D0);
    border: 2px solid #FFD0A8;
    padding: 7px 12px;
    z-index: 41;
  }
  #hud .pill.score #scoreEl {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  #hud .acc { color: #E85A8A; }
  #hud .meta { color: #5A3A22; font-size: 0.75rem; }
  #timeBarWrap {
    flex: 0 0 auto;
    padding: 0 12px 8px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,180,140,0.35);
    z-index: 40;
    position: relative;
  }
  #timeBarTrack {
    position: relative;
    height: 12px;
    border-radius: 999px;
    background: rgba(255,220,190,0.7);
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(180,100,60,0.15);
  }
  #timeBarFill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #FF8A5B, #FF6B9D 55%, #FFB347);
    box-shadow: 0 0 8px rgba(255,107,157,0.35);
    transition: width 0.08s linear, background 0.3s;
    transform-origin: left center;
  }
  #timeBarFill.warn {
    background: linear-gradient(90deg, #FFB347, #FF8A5B 60%, #E85A8A);
  }
  #timeBarFill.critical {
    background: linear-gradient(90deg, #E85A8A, #C62828);
    animation: pulseBar 0.55s ease-in-out infinite alternate;
  }
  @keyframes pulseBar {
    from { filter: brightness(1); }
    to { filter: brightness(1.15); }
  }
  #timeLabel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    color: #5A3A22;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    pointer-events: none;
  }
  #canvasBox {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    z-index: 1;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  canvas#game:active { cursor: grabbing; }
  /* Overlay only covers play area — never banner/HUD/time bar */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(61,41,20,0.45);
    z-index: 10;
    padding: 12px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #overlay.hidden { display: none; }
  .card {
    background: #FFF9F2;
    border-radius: 20px;
    padding: 20px 18px 16px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(61,41,20,0.25);
    border: 2px solid #FFE0C2;
  }
  .card h2 {
    font-size: 1.35rem;
    margin-bottom: 6px;
    color: #C45C26;
  }
  .card .sub {
    font-size: 0.88rem;
    color: #8B6B4A;
    margin-bottom: 14px;
    line-height: 1.45;
  }
  .btn {
    display: inline-block;
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    margin: 4px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, #FF6B9D, #FF8A5B);
    color: #fff;
    box-shadow: 0 4px 14px rgba(255,107,157,0.4);
  }
  .btn-secondary {
    background: #fff;
    color: #C45C26;
    border: 2px solid #FFD0A8;
    box-shadow: 0 2px 8px rgba(180,100,60,0.1);
  }
  #resultScreen { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 360px; }
  #resultScreen.show { display: flex; }
  #resultCanvas {
    width: 100%;
    max-width: 300px;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(61,41,20,0.2);
    background: #FFF9F2;
  }
  .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .hint {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.95);
    text-align: center;
    margin-top: 2px;
    line-height: 1.4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  #floatMsg {
    position: absolute;
    left: 50%;
    top: 22%;
    transform: translate(-50%, 0);
    font-size: 1.35rem;
    font-weight: 800;
    color: #FF6B9D;
    text-shadow: 0 2px 8px rgba(255,255,255,0.9);
    pointer-events: none;
    opacity: 0;
    z-index: 6;
    transition: opacity 0.2s, transform 0.4s;
  }
  #floatMsg.show {
    opacity: 1;
    transform: translate(-50%, -20px);
  }
  #controlsHint {
    position: absolute;
    bottom: 10px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.7rem;
    color: #A07858;
    opacity: 0.85;
    pointer-events: none;
    z-index: 3;
  }
  #runTag {
    font-size: 0.65rem;
    color: #A07858;
    text-align: center;
    padding: 0 10px 4px;
    background: rgba(255,255,255,0.92);
    z-index: 40;
    position: relative;
    min-height: 1em;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="banner">
    <h1>漢堡疊疊樂 🍔</h1>
    <div class="hook">每局材料隨機 · 靠眼力對齊 · 限時挑戰！</div>
  </div>
  <div id="hud">
    <span class="pill score">總分 <span id="scoreEl">0</span></span>
    <span class="pill meta">層 <span id="layerEl">0</span>/<span id="totalLayersEl">10</span></span>
    <span class="pill acc">對齊 <span id="accEl">—</span></span>
  </div>
  <div id="timeBarWrap">
    <div id="timeBarTrack">
      <div id="timeBarFill"></div>
      <div id="timeLabel"><span id="timeEl">32.0</span> 秒</div>
    </div>
  </div>
  <div id="runTag"><span id="runTagEl">準備中…</span></div>
  <div id="canvasBox">
    <canvas id="game"></canvas>
    <div id="floatMsg"></div>
    <div id="controlsHint">← 拖曳／撳左半或右半／方向鍵移動底盤 →</div>
    <div id="overlay">
      <div class="card" id="startCard">
        <h2>準備好未？🍔</h2>
        <p class="sub">每局材料池都會洗牌，偶爾仲有野味料！用手指或滑鼠左右移動底盤接住跌落材料。冇度位指示，全靠眼力；限時內疊到頂包，主廚頭銜極罕有！</p>
        <button class="btn btn-primary" id="startBtn">開始疊漢堡</button>
      </div>
      <div id="resultScreen">
        <canvas id="resultCanvas" width="360" height="720"></canvas>
        <div class="result-actions">
          <button class="btn btn-primary" id="dlBtn">下載結果圖</button>
          <button class="btn btn-secondary" id="retryBtn">再試一次</button>
        </div>
        <p class="hint">💡 每局結果卡都獨一無二——下載後分享去 Threads 挑戰朋友！</p>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── Config (tuned harder / faster) ──────────────────────
  const TOTAL_LAYERS = 10;          // including top bun as last
  const MISS_THRESHOLD = 0.26;     // stricter: more miss-outs
  const PERFECT_TOL = 0.022;       // tighter perfect window
  const BASE_FALL_SPEED = 3.4;     // was 2.2 — much faster
  const SPEED_INC = 0.38;          // accelerates harder per layer
  const BASE_WIDTH = 150;
  const PIECE_H = 28;
  const BUN_H = 36;
  const ROUND_TIME = 32;           // was 45 — shorter round
  const SIDE_DEPTH = 5;

  // Core topping pool (order shuffled each run; top bun always last)
  const CORE_TOPPINGS = [
    { id: 'lettuce', name: '生菜', h: 18 },
    { id: 'tomato',  name: '番茄', h: 22 },
    { id: 'cheese',  name: '芝士', h: 16 },
    { id: 'patty',   name: '肉餅', h: 30 },
    { id: 'onion',   name: '洋蔥', h: 16 },
    { id: 'pickle',  name: '酸瓜', h: 16 },
    { id: 'bacon',   name: '煙肉', h: 18 },
    { id: 'egg',     name: '煎蛋', h: 22 },
  ];

  // Wild toppings (original art, no trademarks) — occasional
  const WILD_TOPPINGS = [
    { id: 'avocado',  name: '牛油果', h: 18 },
    { id: 'mushroom', name: '蘑菇', h: 18 },
    { id: 'chili',    name: '辣椒', h: 16 },
    { id: 'pineapple',name: '菠蘿', h: 18 },
    { id: 'shrimp',   name: '炸蝦', h: 20 },
    { id: 'corn',     name: '玉米', h: 16 },
    { id: 'sauce',    name: '秘製醬', h: 14 },
  ];

  const TOP_BUN = { id: 'topBun', name: '頂包', h: BUN_H };

  const COMBO_PREFIX = ['午夜', '斜斜', '火爆', '軟糯', '暴走', '神秘', '街坊', '極限', '亂撞', '閃避'];
  const COMBO_SUFFIX = ['巨無霸', '塔', '炸彈', '俱樂部', '探險隊', '實驗體', '食堂特餐', '疊疊怪', '傳說包', '夜貓餐'];

  const FORTUNE_LINES = [
    '今日適合挑戰高分，但唔好貪快。',
    '對齊靠感覺，感覺靠練習。',
    '主廚之路，九成半人行唔到盡。',
    '材料隨機，運氣都係技術一部分。',
    '散枱唔緊要，再嚟過就係本事。',
    '完美一層，勝過十層歪歪斜斜。',
    '限時壓力下先見真功夫。',
    '今日漢堡運：中上，記得下載結果卡。',
    '野味料出現＝命運嘅玩笑，接住佢。',
    '分享呢張卡，睇邊個先做到傳說。',
    '眼快手快，心要定。',
    '斜斜都得食，但分數就另講。',
  ];

  const STAMP_EMOJIS = ['🍔','🔥','✨','🎯','🍀','⚡','🌙','💎','🎢','🦞','🌶️','🧀'];

  // Seeded PRNG (mulberry32)
  function mulberry32(a) {
    return function () {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function makeRunId() {
    const t = Date.now().toString(36).toUpperCase();
    const r = Math.floor(Math.random() * 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    return 'BS-' + t.slice(-5) + r;
  }

  function shuffleInPlace(arr, rnd) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function buildIngredientQueue(rnd) {
    // TOTAL_LAYERS falling pieces after bottom bun; last is always top bun
    const midSlots = TOTAL_LAYERS - 1; // toppings before top bun

    const core = CORE_TOPPINGS.map((x) => Object.assign({}, x));
    shuffleInPlace(core, rnd);
    const wild = WILD_TOPPINGS.map((x) => Object.assign({}, x));
    shuffleInPlace(wild, rnd);

    // 1–2 wilds most runs; ~25% chance of 3; rare 0
    let wildN = 1;
    const wr = rnd();
    if (wr < 0.12) wildN = 0;
    else if (wr < 0.55) wildN = 1;
    else if (wr < 0.88) wildN = 2;
    else wildN = 3;
    wildN = Math.min(wildN, wild.length, midSlots - 3);

    const chosen = [];
    for (let i = 0; i < wildN; i++) chosen.push(wild[i]);
    let ci = 0;
    while (chosen.length < midSlots) {
      chosen.push(core[ci % core.length]);
      ci++;
    }
    shuffleInPlace(chosen, rnd);
    // Avoid identical consecutive ids when possible
    for (let i = 1; i < chosen.length; i++) {
      if (chosen[i].id === chosen[i - 1].id) {
        for (let j = i + 1; j < chosen.length; j++) {
          if (chosen[j].id !== chosen[i - 1].id) {
            const t = chosen[i]; chosen[i] = chosen[j]; chosen[j] = t;
            break;
          }
        }
      }
    }
    chosen.push(Object.assign({}, TOP_BUN));
    return chosen;
  }

  function weirdComboName(names, rnd) {
    const mid = names.filter((n) => n !== '底包' && n !== '頂包');
    const a = mid.length ? mid[Math.floor(rnd() * mid.length)] : '神秘';
    const b = mid.length > 1 ? mid[Math.floor(rnd() * mid.length)] : a;
    const pref = COMBO_PREFIX[Math.floor(rnd() * COMBO_PREFIX.length)];
    const suf = COMBO_SUFFIX[Math.floor(rnd() * COMBO_SUFFIX.length)];
    if (rnd() < 0.45) return pref + a + suf;
    return a + '×' + b + suf;
  }

  // Grades — elite rare
  function getGrade(score, avgAcc, perfects, layers, survived, reason) {
    if (reason === 'timeout') {
      if (layers <= 3) return { title: '時間大盜', emoji: '⏰', color: '#E85A8A', tier: 'C' };
      if (layers <= 6) return { title: '趕住收工包', emoji: '🏃', color: '#C45C26', tier: 'C' };
      return { title: '差少少就齊', emoji: '😤', color: '#FF6B9D', tier: 'B' };
    }
    if (!survived) {
      if (layers <= 2) return { title: '散枱新手', emoji: '😅', color: '#A07858', tier: 'D' };
      if (layers <= 5) return { title: '半途而廢包', emoji: '🫠', color: '#C45C26', tier: 'C' };
      return { title: '差少少完美', emoji: '😤', color: '#E85A8A', tier: 'B' };
    }
    // Completed — strict elite
    if (avgAcc >= 97 && perfects >= 7 && score >= 1400) {
      return { title: '傳說廚神', emoji: '👑', color: '#D4A017', tier: 'S' };
    }
    if (avgAcc >= 94 && perfects >= 5 && score >= 1100) {
      return { title: '米芝蓮主廚', emoji: '👨‍🍳', color: '#C9A227', tier: 'A+' };
    }
    if (avgAcc >= 90 && perfects >= 3) {
      return { title: '漢堡藝術家', emoji: '🎨', color: '#FF6B9D', tier: 'A' };
    }
    if (avgAcc >= 82) return { title: '穩陣大廚', emoji: '😎', color: '#C45C26', tier: 'B' };
    if (avgAcc >= 72) return { title: '街坊食店級', emoji: '🏪', color: '#8B6B4A', tier: 'C' };
    if (avgAcc >= 58) return { title: '深夜食堂學徒', emoji: '🌙', color: '#A07858', tier: 'C' };
    return { title: '斜斜都得食', emoji: '🤪', color: '#A07858', tier: 'D' };
  }

  // ── DOM ─────────────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startCard = document.getElementById('startCard');
  const resultScreen = document.getElementById('resultScreen');
  const resultCanvas = document.getElementById('resultCanvas');
  const scoreEl = document.getElementById('scoreEl');
  const layerEl = document.getElementById('layerEl');
  const totalLayersEl = document.getElementById('totalLayersEl');
  const accEl = document.getElementById('accEl');
  const floatMsg = document.getElementById('floatMsg');
  const controlsHint = document.getElementById('controlsHint');
  const timeEl = document.getElementById('timeEl');
  const timeBarFill = document.getElementById('timeBarFill');
  const runTagEl = document.getElementById('runTagEl');

  totalLayersEl.textContent = TOTAL_LAYERS;

  // ── State ───────────────────────────────────────────────
  let W, H, dpr;
  let state = 'start';
  let stack = [];
  let falling = null;
  let score = 0;
  let lastAcc = null;
  let perfects = 0;
  let accSum = 0;
  let placed = 0;
  let nextIdx = 0;
  let keys = {};
  let dragX = null;
  let floatTimer = null;
  let animId = null;
  let fallSpeed = BASE_FALL_SPEED;
  let tableY = 0;
  let shake = 0;
  let particles = [];
  let timeLeft = ROUND_TIME;
  let lastTickTs = 0;
  let endReason = null;

  let runId = '';
  let runSeed = 0;
  let rnd = Math.random;
  let ingredients = [];
  let comboName = '';
  let fortuneLine = '';
  let stampEmoji = '🍔';
  let runStartedAt = null;

  // ── Resize ──────────────────────────────────────────────
  function resize() {
    const box = document.getElementById('canvasBox');
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = box.clientWidth;
    H = box.clientHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tableY = H - 48;
    if (stack.length) {
      let y = tableY;
      for (let i = 0; i < stack.length; i++) {
        stack[i].y = y - stack[i].h;
        y = stack[i].y;
      }
    }
  }
  window.addEventListener('resize', resize);

  // ── Input ───────────────────────────────────────────────
  function moveBase(nx) {
    if (!stack.length || state === 'over' || state === 'result' || state === 'start') return;
    const base = stack[0];
    const half = base.w / 2;
    nx = Math.max(half + 8, Math.min(W - half - 8, nx));
    const dx = nx - (base.x + half);
    for (const p of stack) p.x += dx;
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'playing' && state !== 'falling') return;
    canvas.setPointerCapture(e.pointerId);
    dragX = e.clientX;
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    if (stack.length) {
      const base = stack[0];
      const mid = W / 2;
      if (Math.abs(cx - (base.x + base.w / 2)) > base.w * 0.6) {
        moveBase(base.x + base.w / 2 + (cx < mid ? -28 : 28));
      } else {
        moveBase(cx);
      }
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragX == null) return;
    const rect = canvas.getBoundingClientRect();
    moveBase(e.clientX - rect.left);
  });
  canvas.addEventListener('pointerup', () => { dragX = null; });
  canvas.addEventListener('pointercancel', () => { dragX = null; });

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function updateTimeBar() {
    const ratio = Math.max(0, Math.min(1, timeLeft / ROUND_TIME));
    timeBarFill.style.width = (ratio * 100) + '%';
    timeEl.textContent = timeLeft.toFixed(1);
    timeBarFill.classList.remove('warn', 'critical');
    if (ratio <= 0.2) timeBarFill.classList.add('critical');
    else if (ratio <= 0.4) timeBarFill.classList.add('warn');
  }

  function formatHkTime(d) {
    try {
      return new Intl.DateTimeFormat('zh-HK', {
        timeZone: 'Asia/Hong_Kong',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false,
      }).format(d) + ' (HK)';
    } catch (e) {
      return d.toISOString();
    }
  }

  function resetGame() {
    score = 0; lastAcc = null; perfects = 0; accSum = 0; placed = 0;
    nextIdx = 0; fallSpeed = BASE_FALL_SPEED; particles = []; shake = 0;
    timeLeft = ROUND_TIME; endReason = null; lastTickTs = performance.now();

    runId = makeRunId();
    runSeed = (Date.now() ^ (Math.floor(Math.random() * 0x7fffffff))) >>> 0;
    rnd = mulberry32(runSeed || 1);
    ingredients = buildIngredientQueue(rnd);
    stampEmoji = STAMP_EMOJIS[Math.floor(rnd() * STAMP_EMOJIS.length)];
    fortuneLine = FORTUNE_LINES[Math.floor(rnd() * FORTUNE_LINES.length)];
    comboName = weirdComboName(ingredients.map((x) => x.name), rnd);
    runStartedAt = new Date();

    runTagEl.textContent = '本局 ' + runId + ' · seed ' + runSeed.toString(16).toUpperCase() + ' · ' + stampEmoji;
    updateHUD();
    updateTimeBar();

    const bw = BASE_WIDTH;
    stack = [{
      x: (W - bw) / 2,
      y: tableY - BUN_H,
      w: bw,
      h: BUN_H,
      id: 'bottomBun',
      name: '底包',
    }];
    falling = null;
    state = 'playing';
    controlsHint.style.opacity = '0.85';
    spawnNext();
  }

  function spawnNext() {
    if (nextIdx >= ingredients.length) {
      endReason = 'complete';
      endGame(true);
      return;
    }
    const ing = ingredients[nextIdx];
    const top = stack[stack.length - 1];
    const w = top.w;
    const h = ing.h;
    falling = {
      x: Math.random() * (W - w - 40) + 20,
      y: -h - 10,
      w, h,
      id: ing.id,
      name: ing.name,
      vy: fallSpeed,
    };
    state = 'falling';
    nextIdx++;
    layerEl.textContent = Math.min(nextIdx, TOTAL_LAYERS);
  }

  function showFloat(text, color) {
    floatMsg.textContent = text;
    floatMsg.style.color = color || '#FF6B9D';
    floatMsg.classList.add('show');
    clearTimeout(floatTimer);
    floatTimer = setTimeout(() => floatMsg.classList.remove('show'), 700);
  }

  function landPiece() {
    const top = stack[stack.length - 1];
    const f = falling;

    const left = Math.max(f.x, top.x);
    const right = Math.min(f.x + f.w, top.x + top.w);
    const overlap = Math.max(0, right - left);
    const ratio = overlap / f.w;
    const accPct = Math.round(ratio * 100);

    const fCx = f.x + f.w / 2;
    const tCx = top.x + top.w / 2;
    const centerOff = Math.abs(fCx - tCx);
    const centerRatio = centerOff / top.w;

    if (ratio < MISS_THRESHOLD) {
      lastAcc = accPct;
      accEl.textContent = accPct + '%';
      showFloat('散枱！💥', '#E85A8A');
      spawnMissParticles(f);
      shake = 12;
      falling = null;
      state = 'over';
      endReason = 'miss';
      setTimeout(() => endGame(false), 900);
      return;
    }

    const newW = Math.max(24, overlap);
    const newX = left;
    const newY = top.y - f.h;

    // Stricter scoring curve
    let pts = Math.round(ratio * 85);
    let label = '好！';
    let color = '#C45C26';
    if (centerRatio <= PERFECT_TOL && ratio >= 0.97) {
      pts = Math.round(pts * 1.55) + 25;
      perfects++;
      label = '完美！✨';
      color = '#FF6B9D';
      spawnPerfectParticles(fCx, newY);
    } else if (ratio >= 0.88) {
      pts = Math.round(pts * 1.12);
      label = '差唔多！';
      color = '#FF8A5B';
    } else if (ratio < 0.55) {
      pts = Math.round(pts * 0.85);
      label = '驚險…';
      color = '#A07858';
    }

    pts += Math.floor(nextIdx * 3);
    // Small time bonus for remaining time (elite chase)
    pts += Math.floor(Math.max(0, timeLeft) * 0.15);

    score += pts;
    lastAcc = accPct;
    accSum += accPct;
    placed++;
    updateHUD();
    showFloat(label + ' +' + pts, color);

    stack.push({
      x: newX,
      y: newY,
      w: newW,
      h: f.h,
      id: f.id,
      name: f.name,
    });

    // Refresh combo name from actual toppings used
    comboName = weirdComboName(stack.map((p) => p.name).concat(
      ingredients.slice(nextIdx).map((x) => x.name)
    ), rnd);

    falling = null;
    fallSpeed = BASE_FALL_SPEED + SPEED_INC * nextIdx;
    state = 'playing';

    const topY = stack[stack.length - 1].y;
    if (topY < 80) {
      const shift = 80 - topY;
      for (const p of stack) p.y += shift;
    }

    setTimeout(spawnNext, 300);
  }

  function updateHUD() {
    scoreEl.textContent = score;
    accEl.textContent = lastAcc == null ? '—' : lastAcc + '%';
  }

  function endGame(survived) {
    state = 'result';
    controlsHint.style.opacity = '0';
    // Final combo from stacked pieces only
    comboName = weirdComboName(stack.map((p) => p.name), rnd);
    const avgAcc = placed > 0 ? Math.round(accSum / placed) : 0;
    const reason = endReason || (survived ? 'complete' : 'miss');
    const grade = getGrade(score, avgAcc, perfects, placed, survived, reason);
    drawResultCard(survived, avgAcc, grade, reason);
    startCard.style.display = 'none';
    resultScreen.classList.add('show');
    overlay.classList.remove('hidden');
  }

  function spawnPerfectParticles(x, y) {
    for (let i = 0; i < 14; i++) {
      particles.push({
        x, y: y + 10,
        vx: (Math.random() - 0.5) * 6,
        vy: -Math.random() * 5 - 2,
        life: 40 + Math.random() * 20,
        color: ['#FF6B9D', '#FFD700', '#FF8A5B', '#fff'][i % 4],
        r: 3 + Math.random() * 3,
      });
    }
  }
  function spawnMissParticles(f) {
    for (let i = 0; i < 10; i++) {
      particles.push({
        x: f.x + f.w / 2,
        y: f.y + f.h / 2,
        vx: (Math.random() - 0.5) * 8,
        vy: Math.random() * 4 + 1,
        life: 35,
        color: '#8B6B4A',
        r: 2 + Math.random() * 3,
      });
    }
  }

  function roundRect(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function softShadow(c, cx, yBottom, w, alpha) {
    c.save();
    c.globalAlpha = alpha == null ? 0.18 : alpha;
    const g = c.createRadialGradient(cx, yBottom + 2, 1, cx, yBottom + 2, w * 0.5);
    g.addColorStop(0, 'rgba(60,30,10,0.55)');
    g.addColorStop(1, 'rgba(60,30,10,0)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(cx, yBottom + 3, w * 0.48, 5, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  function sideBand(c, x, y, w, h, depth, color) {
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(x, y + h);
    c.lineTo(x + w, y + h);
    c.lineTo(x + w - 2, y + h + depth);
    c.lineTo(x + 2, y + h + depth);
    c.closePath();
    c.fill();
  }

  function topHighlight(c, x, y, w, h, rx) {
    c.save();
    c.globalAlpha = 0.35;
    const g = c.createLinearGradient(x, y, x, y + h * 0.55);
    g.addColorStop(0, 'rgba(255,255,255,0.7)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    roundRect(c, x + 3, y + 2, w - 6, Math.max(4, h * 0.4), rx || 6);
    c.fill();
    c.restore();
  }

  function drawIngredient(p, alpha) {
    drawIngredientOn(ctx, p, alpha);
  }

  function drawIngredientOn(c, p, alpha) {
    c.save();
    if (alpha != null) c.globalAlpha = alpha;
    const { x, y, w, h, id } = p;
    const cx = x + w / 2;
    const d = Math.min(SIDE_DEPTH, Math.max(3, h * 0.28));

    softShadow(c, cx, y + h, w, 0.16);

    if (id === 'bottomBun' || id === 'topBun') {
      const isTop = id === 'topBun';
      if (isTop) {
        c.fillStyle = '#C87830';
        c.beginPath();
        c.ellipse(cx, y + h - 2, w / 2, 6, 0, 0, Math.PI * 2);
        c.fill();
        const bunG = c.createLinearGradient(x, y, x, y + h);
        bunG.addColorStop(0, '#F5C878');
        bunG.addColorStop(0.45, '#E8A04A');
        bunG.addColorStop(1, '#D4893A');
        c.fillStyle = bunG;
        c.beginPath();
        c.ellipse(cx, y + h * 0.58, w / 2, h * 0.58, 0, Math.PI, 0);
        c.lineTo(x + w, y + h - 2);
        c.ellipse(cx, y + h - 2, w / 2, 5, 0, 0, Math.PI);
        c.closePath();
        c.fill();
        c.fillStyle = 'rgba(255,245,210,0.5)';
        c.beginPath();
        c.ellipse(cx - w * 0.12, y + h * 0.32, w * 0.26, h * 0.2, -0.35, 0, Math.PI * 2);
        c.fill();
        for (let i = 0; i < 8; i++) {
          const sx = x + w * (0.16 + (i % 4) * 0.2) + (i > 3 ? w * 0.08 : 0);
          const sy = y + h * (0.22 + Math.floor(i / 4) * 0.2);
          c.fillStyle = 'rgba(180,120,60,0.25)';
          c.beginPath();
          c.ellipse(sx + 0.5, sy + 0.8, 3.2, 2.1, 0.4, 0, Math.PI * 2);
          c.fill();
          c.fillStyle = '#F8ECD4';
          c.beginPath();
          c.ellipse(sx, sy, 3, 1.9, 0.4, 0, Math.PI * 2);
          c.fill();
        }
      } else {
        sideBand(c, x, y, w, h, d, '#B86A28');
        const bunG = c.createLinearGradient(x, y, x, y + h);
        bunG.addColorStop(0, '#F2BC6A');
        bunG.addColorStop(0.55, '#E09440');
        bunG.addColorStop(1, '#C87830');
        c.fillStyle = bunG;
        roundRect(c, x, y, w, h, 12);
        c.fill();
        c.fillStyle = '#F5C878';
        c.beginPath();
        c.ellipse(cx, y + 5, w * 0.48, 7, 0, 0, Math.PI * 2);
        c.fill();
        topHighlight(c, x, y, w, h, 10);
        c.strokeStyle = 'rgba(180,100,40,0.25)';
        c.lineWidth = 1.5;
        c.beginPath();
        c.ellipse(cx, y + h - 4, w * 0.46, 4, 0, 0, Math.PI);
        c.stroke();
      }
    } else if (id === 'lettuce' || id === 'lettuce2') {
      sideBand(c, x - 2, y, w + 4, h, d - 1, '#558B2F');
      const lg = c.createLinearGradient(x, y, x, y + h);
      lg.addColorStop(0, '#9CCC65');
      lg.addColorStop(1, '#689F38');
      c.fillStyle = lg;
      c.beginPath();
      const waves = 6;
      c.moveTo(x, y + h * 0.45);
      for (let i = 0; i <= waves; i++) {
        const px = x + (w / waves) * i;
        const py = y + (i % 2 === 0 ? 1 : h - 1);
        c.quadraticCurveTo(px - w / waves / 2, (i % 2 === 0 ? h * 0.2 : h * 0.8) + y, px, py);
      }
      for (let i = waves; i >= 0; i--) {
        const px = x + (w / waves) * i;
        const py = y + h * 0.55 + (i % 2 === 0 ? 3 : -3);
        c.lineTo(px, py);
      }
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(200,240,140,0.45)';
      c.beginPath();
      c.moveTo(x + 6, y + h * 0.4);
      for (let i = 0; i <= 4; i++) {
        c.lineTo(x + 6 + ((w - 12) / 4) * i, y + (i % 2 ? 5 : h - 7));
      }
      c.lineTo(x + w - 6, y + h * 0.5);
      c.closePath();
      c.fill();
    } else if (id === 'tomato') {
      sideBand(c, x, y, w, h, d, '#B71C1C');
      const tg = c.createLinearGradient(x, y, x, y + h);
      tg.addColorStop(0, '#EF5350');
      tg.addColorStop(0.5, '#E53935');
      tg.addColorStop(1, '#C62828');
      c.fillStyle = tg;
      roundRect(c, x, y, w, h, h / 2);
      c.fill();
      c.fillStyle = 'rgba(255,200,200,0.4)';
      c.beginPath();
      c.ellipse(cx, y + h * 0.32, w * 0.38, h * 0.22, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(255,220,160,0.55)';
      for (let i = 0; i < 5; i++) {
        c.beginPath();
        c.ellipse(x + w * (0.15 + i * 0.175), y + h * 0.58, 2.8, 1.8, 0.2, 0, Math.PI * 2);
        c.fill();
      }
    } else if (id === 'cheese') {
      c.fillStyle = '#E6A800';
      c.beginPath();
      c.moveTo(x - 5, y + 2);
      c.lineTo(x + w + 5, y + 2);
      c.lineTo(x + w + 2, y + h + d);
      c.lineTo(x - 2, y + h + d);
      c.closePath();
      c.fill();
      const cg = c.createLinearGradient(x, y, x, y + h);
      cg.addColorStop(0, '#FFE082');
      cg.addColorStop(0.5, '#FFC107');
      cg.addColorStop(1, '#FFB300');
      c.fillStyle = cg;
      c.beginPath();
      c.moveTo(x - 5, y);
      c.lineTo(x + w + 5, y);
      c.lineTo(x + w - 1, y + h);
      c.lineTo(x + 1, y + h);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(255,255,220,0.45)';
      c.beginPath();
      c.moveTo(x, y + 2);
      c.lineTo(x + w, y + 2);
      c.lineTo(x + w - 5, y + h * 0.45);
      c.lineTo(x + 5, y + h * 0.45);
      c.closePath();
      c.fill();
    } else if (id === 'patty') {
      sideBand(c, x, y, w, h, d + 1, '#3E2723');
      const pg = c.createLinearGradient(x, y, x, y + h);
      pg.addColorStop(0, '#8D6E63');
      pg.addColorStop(0.4, '#5D4037');
      pg.addColorStop(1, '#4E342E');
      c.fillStyle = pg;
      roundRect(c, x, y, w, h, 10);
      c.fill();
      c.fillStyle = '#6D4C41';
      c.beginPath();
      c.ellipse(cx, y + 5, w * 0.46, 5, 0, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = 'rgba(30,18,12,0.4)';
      c.lineWidth = 2.2;
      c.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        c.beginPath();
        c.moveTo(x + 12, y + 9 + i * 7);
        c.lineTo(x + w - 12, y + 11 + i * 7);
        c.stroke();
      }
      topHighlight(c, x, y, w, h, 8);
    } else if (id === 'onion') {
      sideBand(c, x, y, w, h, d - 1, '#F48FB1');
      const og = c.createLinearGradient(x, y, x, y + h);
      og.addColorStop(0, '#FCE4EC');
      og.addColorStop(1, '#F8BBD0');
      c.fillStyle = og;
      roundRect(c, x, y, w, h, h / 2);
      c.fill();
      c.strokeStyle = 'rgba(244,143,177,0.7)';
      c.lineWidth = 1.4;
      for (let i = 1; i < 3; i++) {
        c.beginPath();
        c.ellipse(cx, y + (h / 3) * i, w * 0.42, 2.5, 0, 0, Math.PI * 2);
        c.stroke();
      }
      topHighlight(c, x, y, w, h, h / 2);
    } else if (id === 'pickle') {
      sideBand(c, x, y, w, h, d - 1, '#33691E');
      const pig = c.createLinearGradient(x, y, x, y + h);
      pig.addColorStop(0, '#9CCC65');
      pig.addColorStop(1, '#558B2F');
      c.fillStyle = pig;
      roundRect(c, x, y, w, h, 5);
      c.fill();
      for (let i = 0; i < 5; i++) {
        c.fillStyle = 'rgba(255,255,200,0.35)';
        c.beginPath();
        c.arc(x + w * (0.14 + i * 0.18), y + h * 0.45, 2.6, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#7CB342';
        c.beginPath();
        c.arc(x + w * (0.14 + i * 0.18), y + h * 0.48, 2.2, 0, Math.PI * 2);
        c.fill();
      }
    } else if (id === 'bacon') {
      sideBand(c, x, y, w, h, d - 1, '#8E0000');
      const bg = c.createLinearGradient(x, y, x, y + h);
      bg.addColorStop(0, '#E57373');
      bg.addColorStop(1, '#C62828');
      c.fillStyle = bg;
      roundRect(c, x, y, w, h, 4);
      c.fill();
      for (let i = 0; i < 3; i++) {
        const yy = y + 3 + i * 5;
        const fat = c.createLinearGradient(x, yy, x + w, yy);
        fat.addColorStop(0, '#FFE0B2');
        fat.addColorStop(0.5, '#FFCC80');
        fat.addColorStop(1, '#FFE0B2');
        c.fillStyle = fat;
        roundRect(c, x + 1, yy, w - 2, 3, 1);
        c.fill();
      }
    } else if (id === 'egg') {
      sideBand(c, x, y, w, h, d, '#E0D5B8');
      const eg = c.createRadialGradient(cx, y + h * 0.4, 2, cx, y + h * 0.5, w * 0.5);
      eg.addColorStop(0, '#FFFAF0');
      eg.addColorStop(1, '#F0E6C8');
      c.fillStyle = eg;
      roundRect(c, x, y, w, h, h / 2);
      c.fill();
      const yolkR = Math.min(w * 0.22, 16);
      const yg = c.createRadialGradient(cx - 3, y + h / 2 - 2, 1, cx, y + h / 2, yolkR);
      yg.addColorStop(0, '#FFE082');
      yg.addColorStop(0.6, '#FFC107');
      yg.addColorStop(1, '#FF8F00');
      c.fillStyle = yg;
      c.beginPath();
      c.ellipse(cx, y + h / 2, yolkR, h * 0.32, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(255,255,255,0.55)';
      c.beginPath();
      c.ellipse(cx - yolkR * 0.3, y + h / 2 - h * 0.1, yolkR * 0.28, h * 0.1, -0.4, 0, Math.PI * 2);
      c.fill();
    } else if (id === 'avocado') {
      sideBand(c, x, y, w, h, d, '#558B2F');
      const ag = c.createLinearGradient(x, y, x, y + h);
      ag.addColorStop(0, '#AED581');
      ag.addColorStop(1, '#7CB342');
      c.fillStyle = ag;
      roundRect(c, x, y, w, h, h / 2);
      c.fill();
      c.fillStyle = '#F9A825';
      c.beginPath();
      c.ellipse(cx, y + h / 2, Math.min(w * 0.14, 10), h * 0.28, 0, 0, Math.PI * 2);
      c.fill();
      topHighlight(c, x, y, w, h, h / 2);
    } else if (id === 'mushroom') {
      sideBand(c, x, y, w, h, d, '#6D4C41');
      const mg = c.createLinearGradient(x, y, x, y + h);
      mg.addColorStop(0, '#EFEBE9');
      mg.addColorStop(1, '#BCAAA4');
      c.fillStyle = mg;
      roundRect(c, x, y, w, h, 8);
      c.fill();
      c.fillStyle = 'rgba(121,85,72,0.35)';
      for (let i = 0; i < 4; i++) {
        c.beginPath();
        c.arc(x + w * (0.2 + i * 0.2), y + h * 0.45, 3, 0, Math.PI * 2);
        c.fill();
      }
      topHighlight(c, x, y, w, h, 6);
    } else if (id === 'chili') {
      sideBand(c, x, y, w, h, d - 1, '#B71C1C');
      const chg = c.createLinearGradient(x, y, x + w, y + h);
      chg.addColorStop(0, '#FF7043');
      chg.addColorStop(1, '#D32F2F');
      c.fillStyle = chg;
      roundRect(c, x, y, w, h, 6);
      c.fill();
      c.fillStyle = '#2E7D32';
      roundRect(c, x + w * 0.42, y - 2, w * 0.16, 5, 2);
      c.fill();
      topHighlight(c, x, y, w, h, 4);
    } else if (id === 'pineapple') {
      sideBand(c, x, y, w, h, d, '#F9A825');
      const png = c.createLinearGradient(x, y, x, y + h);
      png.addColorStop(0, '#FFE082');
      png.addColorStop(1, '#FFB300');
      c.fillStyle = png;
      roundRect(c, x, y, w, h, 5);
      c.fill();
      c.strokeStyle = 'rgba(255,143,0,0.5)';
      c.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        c.beginPath();
        c.moveTo(x + 8, y + 5 + i * 5);
        c.lineTo(x + w - 8, y + 7 + i * 5);
        c.stroke();
      }
    } else if (id === 'shrimp') {
      sideBand(c, x, y, w, h, d, '#E64A19');
      const sg = c.createLinearGradient(x, y, x, y + h);
      sg.addColorStop(0, '#FFAB91');
      sg.addColorStop(1, '#FF7043');
      c.fillStyle = sg;
      roundRect(c, x, y, w, h, h / 2);
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.45)';
      c.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        c.beginPath();
        c.arc(x + w * (0.2 + i * 0.2), y + h * 0.5, 4, Math.PI * 0.2, Math.PI * 0.8);
        c.stroke();
      }
      topHighlight(c, x, y, w, h, h / 2);
    } else if (id === 'corn') {
      sideBand(c, x, y, w, h, d - 1, '#F9A825');
      const cog = c.createLinearGradient(x, y, x, y + h);
      cog.addColorStop(0, '#FFF59D');
      cog.addColorStop(1, '#FFD54F');
      c.fillStyle = cog;
      roundRect(c, x, y, w, h, 4);
      c.fill();
      c.fillStyle = '#FFC107';
      for (let row = 0; row < 2; row++) {
        for (let i = 0; i < 6; i++) {
          c.beginPath();
          c.arc(x + w * (0.12 + i * 0.15), y + h * (0.35 + row * 0.35), 2.4, 0, Math.PI * 2);
          c.fill();
        }
      }
    } else if (id === 'sauce') {
      c.fillStyle = '#BF360C';
      c.beginPath();
      c.moveTo(x + 4, y + 2);
      c.quadraticCurveTo(x + w * 0.25, y + h + d, x + w * 0.4, y + h * 0.6);
      c.quadraticCurveTo(x + w * 0.55, y + h + d + 2, x + w * 0.7, y + h * 0.5);
      c.quadraticCurveTo(x + w * 0.85, y + h + d, x + w - 4, y + 2);
      c.closePath();
      c.fill();
      const sag = c.createLinearGradient(x, y, x, y + h);
      sag.addColorStop(0, '#FF8A65');
      sag.addColorStop(1, '#E64A19');
      c.fillStyle = sag;
      roundRect(c, x, y, w, h * 0.7, 4);
      c.fill();
    } else {
      sideBand(c, x, y, w, h, d, '#6D4C41');
      c.fillStyle = '#A1887F';
      roundRect(c, x, y, w, h, 6);
      c.fill();
      topHighlight(c, x, y, w, h, 6);
    }

    c.restore();
  }

  function drawTable() {
    ctx.fillStyle = '#FFE8D0';
    ctx.fillRect(0, tableY, W, H - tableY);
    ctx.fillStyle = '#FFD9B8';
    ctx.fillRect(0, tableY, W, 4);
    const pg = ctx.createRadialGradient(W / 2, tableY + 18, 4, W / 2, tableY + 18, Math.min(W * 0.42, 180));
    pg.addColorStop(0, '#FFFFFF');
    pg.addColorStop(0.7, '#FFF8F0');
    pg.addColorStop(1, '#F0D8C0');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.ellipse(W / 2, tableY + 18, Math.min(W * 0.42, 180), 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(240,200,160,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(W / 2, tableY + 16, Math.min(W * 0.36, 150), 10, 0, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  }

  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#FFE8D6');
    g.addColorStop(0.5, '#FFF5EB');
    g.addColorStop(1, '#FFEFD9');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,200,160,0.22)';
    for (let i = 0; i < 12; i++) {
      const px = (i * 97 + 40) % W;
      const py = (i * 73 + 30) % (H * 0.7);
      ctx.beginPath();
      ctx.arc(px, py, 3 + (i % 3), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function wrapText(rctx, text, x, y, maxW, lineH) {
    const chars = String(text).split('');
    let line = '';
    let yy = y;
    for (let i = 0; i < chars.length; i++) {
      const test = line + chars[i];
      if (rctx.measureText(test).width > maxW && line) {
        rctx.fillText(line, x, yy);
        line = chars[i];
        yy += lineH;
      } else {
        line = test;
      }
    }
    if (line) rctx.fillText(line, x, yy);
    return yy;
  }

  function drawResultCard(survived, avgAcc, grade, reason) {
    const rc = resultCanvas;
    const rctx = rc.getContext('2d');
    const RW = 360, RH = 720;
    rc.width = RW; rc.height = RH;

    const bg = rctx.createLinearGradient(0, 0, 0, RH);
    bg.addColorStop(0, '#FF6B9D');
    bg.addColorStop(0.18, '#FF8FB5');
    bg.addColorStop(0.18, '#FFF5EB');
    bg.addColorStop(1, '#FFE8D6');
    rctx.fillStyle = bg;
    rctx.fillRect(0, 0, RW, RH);

    rctx.fillStyle = '#fff';
    rctx.font = 'bold 24px "PingFang TC", "Noto Sans TC", sans-serif';
    rctx.textAlign = 'center';
    rctx.fillText('漢堡疊疊樂 🍔', RW / 2, 42);
    rctx.font = '12px "PingFang TC", "Noto Sans TC", sans-serif';
    rctx.fillText('每局材料隨機 · 靠眼力對齊', RW / 2, 64);

    rctx.fillStyle = '#FFF9F2';
    roundRect(rctx, 20, 82, RW - 40, 600, 20);
    rctx.fill();
    rctx.strokeStyle = '#FFE0C2';
    rctx.lineWidth = 2;
    rctx.stroke();

    // Emoji stamp (unique per run)
    rctx.save();
    rctx.translate(RW - 58, 118);
    rctx.rotate(0.35);
    rctx.globalAlpha = 0.92;
    rctx.font = '36px serif';
    rctx.fillText(stampEmoji, 0, 0);
    rctx.restore();

    // Tier badge
    rctx.fillStyle = grade.color;
    rctx.font = 'bold 11px "PingFang TC", sans-serif';
    rctx.fillText('稀有度 ' + (grade.tier || '?'), RW / 2, 112);

    rctx.fillStyle = grade.color;
    rctx.font = 'bold 22px "PingFang TC", "Noto Sans TC", sans-serif';
    rctx.fillText(grade.emoji + ' ' + grade.title, RW / 2, 142);

    // Combo name
    rctx.fillStyle = '#E85A8A';
    rctx.font = 'bold 15px "PingFang TC", sans-serif';
    const cn = '「' + comboName + '」';
    if (rctx.measureText(cn).width > RW - 60) {
      rctx.font = 'bold 13px "PingFang TC", sans-serif';
    }
    rctx.fillText(cn, RW / 2, 168);

    rctx.fillStyle = '#C45C26';
    rctx.font = 'bold 58px "PingFang TC", system-ui, sans-serif';
    rctx.fillText(String(score), RW / 2, 235);
    rctx.font = '15px "PingFang TC", sans-serif';
    rctx.fillStyle = '#8B6B4A';
    rctx.fillText('總分', RW / 2, 258);

    drawMiniStack(rctx, RW / 2, 318);

    let resultText = '完成漢堡 ✅';
    if (reason === 'timeout') resultText = '時間到 ⏰';
    else if (!survived) resultText = '散枱出局 💥';

    const ended = new Date();
    const lines = [
      { label: '層數', value: placed + ' / ' + TOTAL_LAYERS },
      { label: '平均對齊%', value: avgAcc + '%' },
      { label: '完美次數', value: String(perfects) },
      { label: '結果', value: resultText },
      { label: 'Run ID', value: runId },
      { label: 'Seed', value: runSeed.toString(16).toUpperCase() },
    ];
    rctx.font = '13px "PingFang TC", sans-serif';
    rctx.textAlign = 'left';
    let ly = 395;
    lines.forEach((ln) => {
      rctx.fillStyle = '#A07858';
      rctx.fillText(ln.label, 48, ly);
      rctx.fillStyle = '#3D2914';
      rctx.textAlign = 'right';
      rctx.font = 'bold 13px "PingFang TC", sans-serif';
      rctx.fillText(ln.value, RW - 48, ly);
      rctx.textAlign = 'left';
      rctx.font = '13px "PingFang TC", sans-serif';
      ly += 26;
    });

    // 廚神簽
    rctx.textAlign = 'center';
    rctx.fillStyle = '#C45C26';
    rctx.font = 'bold 13px "PingFang TC", sans-serif';
    rctx.fillText('—— 廚神簽 ——', RW / 2, ly + 8);
    rctx.fillStyle = '#5A3A22';
    rctx.font = '12px "PingFang TC", sans-serif';
    wrapText(rctx, fortuneLine, RW / 2, ly + 28, RW - 70, 18);

    rctx.fillStyle = '#A07858';
    rctx.font = '11px "PingFang TC", sans-serif';
    rctx.fillText(formatHkTime(ended), RW / 2, 660);
    rctx.fillText('分享去 Threads，睇邊個疊得齊！', RW / 2, 680);
  }

  function drawMiniStack(rctx, cx, cy) {
    if (!stack.length) return;
    const scale = 0.5;
    const totalH = stack.reduce((s, p) => s + p.h, 0) * scale;
    let y = cy + totalH / 2;
    const avgCx = stack.reduce((s, p) => s + p.x + p.w / 2, 0) / stack.length;
    for (let i = 0; i < stack.length; i++) {
      const p = stack[i];
      const mw = p.w * scale;
      const mh = p.h * scale;
      const mx = cx - mw / 2 + (p.x + p.w / 2 - avgCx) * scale * 0.3;
      y -= mh;
      drawIngredientOn(rctx, { x: mx, y, w: mw, h: mh, id: p.id }, 1);
    }
  }

  function tick(ts) {
    if (!lastTickTs) lastTickTs = ts;
    const dt = Math.min(0.05, (ts - lastTickTs) / 1000);
    lastTickTs = ts;

    if (state === 'playing' || state === 'falling') {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateTimeBar();
        if (state !== 'over' && state !== 'result') {
          showFloat('時間到！⏰', '#E85A8A');
          shake = 10;
          falling = null;
          state = 'over';
          endReason = 'timeout';
          setTimeout(() => endGame(false), 700);
        }
      } else {
        updateTimeBar();
      }
    }

    if (state === 'playing' || state === 'falling') {
      let dx = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 6.5;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 6.5;
      if (dx) {
        const base = stack[0];
        moveBase(base.x + base.w / 2 + dx);
      }
    }

    if (state === 'falling' && falling) {
      falling.y += falling.vy;
      const top = stack[stack.length - 1];
      if (falling.y + falling.h >= top.y) {
        falling.y = top.y - falling.h;
        landPiece();
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (shake > 0) shake *= 0.85;
    if (shake < 0.3) shake = 0;

    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.save();
    if (shake) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBg();
    drawTable();
    for (const p of stack) drawIngredient(p);
    if (falling) {
      drawIngredient(falling, 0.95);
    }
    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life / 20);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    overlay.classList.add('hidden');
    resultScreen.classList.remove('show');
    startCard.style.display = 'block';
    resize();
    resetGame();
  });

  document.getElementById('retryBtn').addEventListener('click', () => {
    overlay.classList.add('hidden');
    resultScreen.classList.remove('show');
    startCard.style.display = 'block';
    resize();
    resetGame();
  });

  document.getElementById('dlBtn').addEventListener('click', () => {
    const url = resultCanvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'burger-stack-' + (runId || 'result') + '.png';
    a.click();
  });

  resize();
  updateTimeBar();
  draw();
  animId = requestAnimationFrame(tick);
})();
</script>
